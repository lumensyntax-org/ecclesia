name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
      - name: Install (clean, lockfile-checked)
        run: npm ci
      - name: Typecheck + format + tests
        run: npm run check
      - name: Build (llms export + Quartz)
        run: npm run build
